services:
  - type: web
    name: wavelet
    env: python
    rootDir: .
    plan: free
    buildCommand: pip install -r requirements.txt && cd frontend && npm ci && npm run build:webpack && cd .. && python manage.py migrate && python manage.py collectstatic --noinput
    startCommand: gunicorn music_controller.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: .onrender.com,127.0.0.1,localhost
      - key: DATABASE_URL
        fromDatabase:
          name: wavelet-db
          property: connectionString
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        sync: false

databases:
  - name: wavelet-db
    plan: free
